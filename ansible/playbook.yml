---
- name: Configure Minecraft server
  hosts: all
  become: true

  vars:
    minecraft_data_dir: /opt/minecraft/data
    minecraft_container_name: minecraft
    aws_region: "us-east-1"
    image_tag: "latest"

  tasks:

    # ── Prerequisites ─────────────────────────────────────────────────────────

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - unzip
          - python3-pip
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: true

    - name: Install AWS CLI v2
      shell: |
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -o /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --update
        rm -rf /tmp/awscliv2.zip /tmp/aws
      args:
        creates: /usr/local/bin/aws

    # ── ECR authentication ────────────────────────────────────────────────────

    - name: Authenticate Docker to ECR using instance profile
      shell: |
        aws ecr get-login-password --region {{ aws_region }} \
          | docker login --username AWS --password-stdin {{ ecr_repo_url }}
      changed_when: true

    # ── World data directory ──────────────────────────────────────────────────

    - name: Create Minecraft data directory
      file:
        path: "{{ minecraft_data_dir }}"
        state: directory
        mode: "0755"

    # ── World restore from S3 ─────────────────────────────────────────────────

    - name: Check if world data already exists locally
      stat:
        path: "{{ minecraft_data_dir }}/world"
      register: world_dir

    - name: Restore world data from S3 (only if no local world exists)
      shell: |
        aws s3 sync s3://{{ s3_bucket }}/world {{ minecraft_data_dir }}/world \
          --region {{ aws_region }}
      when: not world_dir.stat.exists
      changed_when: true

    # ── Pull image ────────────────────────────────────────────────────────────

    - name: Pull pinned Minecraft image from ECR
      community.docker.docker_image:
        name: "{{ ecr_repo_url }}:{{ image_tag }}"
        source: pull
        force_source: true

    # ── Stop and remove old container if present ──────────────────────────────

    - name: Remove existing Minecraft container (if any)
      community.docker.docker_container:
        name: "{{ minecraft_container_name }}"
        state: absent

    # ── Start Minecraft container ─────────────────────────────────────────────

    - name: Start Minecraft container
      community.docker.docker_container:
        name: "{{ minecraft_container_name }}"
        image: "{{ ecr_repo_url }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "25565:25565"
        volumes:
          - "{{ minecraft_data_dir }}:/data"
        env:
          EULA: "TRUE"
          MEMORY: "2G"
          MOTD: "CS312 Minecraft - Sjoerd De Bruyn"
        detach: true

    # ── Verify server started ─────────────────────────────────────────────────

    - name: Wait for Minecraft server to finish loading
      shell: docker logs {{ minecraft_container_name }} 2>&1 | grep -c "Done"
      register: mc_ready
      retries: 12
      delay: 10
      until: mc_ready.stdout | int > 0
      changed_when: false

    - name: Confirm server is running
      debug:
        msg: "Minecraft server is up and listening on port 25565"
