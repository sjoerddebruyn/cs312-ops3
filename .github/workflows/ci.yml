name: Build and Push Minecraft Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          aws configure set region us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull upstream Minecraft image
        run: docker pull itzg/minecraft-server:latest

      - name: Tag for ECR
        run: |
          docker tag itzg/minecraft-server:latest \
            ${{ secrets.ECR_REGISTRY }}/cs312-minecraft:${{ github.ref_name }}
          docker tag itzg/minecraft-server:latest \
            ${{ secrets.ECR_REGISTRY }}/cs312-minecraft:latest

      - name: Smoke test
        run: |
          docker run -d \
            --name mc-smoke \
            -e EULA=TRUE \
            -e MEMORY=1G \
            itzg/minecraft-server:latest

          echo "Waiting for server to initialize..."
          for i in $(seq 1 12); do
            sleep 10
            if docker logs mc-smoke 2>&1 | grep -q "Done"; then
              echo "Smoke test passed"
              docker stop mc-smoke
              exit 0
            fi
            echo "Attempt $i/12 — not ready yet..."
          done

          echo "Smoke test FAILED"
          docker logs mc-smoke
          docker stop mc-smoke
          exit 1

      - name: Push image to ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/cs312-minecraft:${{ github.ref_name }}
          docker push ${{ secrets.ECR_REGISTRY }}/cs312-minecraft:latest
